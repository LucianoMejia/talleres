    type: overlay
  page-navigation: true
  back-to-top-navigation: true
  bread-crumbs: true
  navbar:
    background: "#155456"
    foreground: "#ffffff"
    left:
      - text: "Inicio"
        href: index.qmd
      - text: "Materias"
